[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linked-pubs"
version = "0.1.0"
description = "Factual statement extraction and resolution from scientific sources (nutrition)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.14",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
linked-pubs = "linked_pubs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
